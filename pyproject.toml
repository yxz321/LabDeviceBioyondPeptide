[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioyond_peptide_station"
version = "0.1.0"
description = "Uni-Lab-OS external device package for the Bioyond peptide synthesis workstation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "requests",
    "pydantic",
    "typing_extensions",
]

[project.optional-dependencies]
dev = [
    "unilabos",
]

[tool.setuptools.packages.find]
include = ["bioyond_peptide_station*"]
